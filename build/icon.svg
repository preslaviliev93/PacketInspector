<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <!-- packet rows in the background -->
  <g fill="#ffffff" opacity="0.14">
    <rect x="84" y="96" width="250" height="22" rx="11"/>
    <rect x="84" y="140" width="180" height="22" rx="11"/>
    <rect x="300" y="386" width="128" height="22" rx="11"/>
  </g>
  <!-- magnifier -->
  <circle cx="228" cy="246" r="118" fill="url(#lens)" stroke="#ffffff" stroke-width="34"/>
  <path d="M316 334 L410 428" stroke="#ffffff" stroke-width="46" stroke-linecap="round"/>
  <!-- traffic pulse inside the lens -->
  <path d="M138 252 H182 L204 196 L240 304 L264 228 L280 252 H318" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
